<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Land ERP Dashboard V3</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #2c3e50; margin: 0; }

        /* Month selector */
        .toolbar { max-width: 1200px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
        .toolbar label { font-weight: 600; color: #2c3e50; }
        .toolbar select, .toolbar button { font-size: 1em; padding: 8px 12px; border: 1px solid #ccd3da; border-radius: 6px; background: #fff; cursor: pointer; }
        .toolbar button:hover:not(:disabled) { background: #ecf0f1; }
        .toolbar button:disabled { opacity: 0.4; cursor: default; }
        .period-label { text-align: center; color: #7f8c8d; margin: -5px 0 20px; }

        .dashboard-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }

        /* Clickable Cards */
        .card { background: #fff; padding: 20px 20px 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #3498db; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .card::after { content: 'Click for details \25B6'; position: absolute; bottom: 8px; left: 0; right: 0; font-size: 0.8em; color: #aaa; opacity: 0; transition: opacity 0.2s; }
        .card:hover::after { opacity: 1; }
        .card h3 { margin-top: 0; color: #7f8c8d; font-size: 1.1em; text-transform: uppercase; }
        .card .value { font-size: 1.8em; font-weight: bold; color: #2c3e50; margin-bottom: 6px; }
        .card .change { font-size: 0.85em; min-height: 1.2em; }
        .card.profit-net { border-top-color: #27ae60; }
        .card.profit-net .value { color: #27ae60; }
        .card.profit-net.negative { border-top-color: #e74c3c; }
        .card.profit-net.negative .value { color: #e74c3c; }
        .card.expense { border-top-color: #e74c3c; }
        .card.expense .value { color: #e74c3c; }
        .up { color: #27ae60; } .down { color: #e74c3c; } .flat { color: #95a5a6; }

        /* Monthly table */
        .table-wrap { max-width: 1200px; margin: 35px auto 0; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; overflow-x: auto; }
        .table-wrap h2 { margin: 0 0 15px; color: #2c3e50; font-size: 1.3em; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid #f1f2f6; white-space: nowrap; }
        th:first-child, td:first-child { text-align: left; }
        th { background: #f4f6f8; color: #7f8c8d; font-size: 0.85em; text-transform: uppercase; }
        tbody tr { cursor: pointer; }
        tbody tr:hover { background: #f8fbff; }
        tbody tr.active { background: #eaf4fc; font-weight: 600; }
        tfoot td { font-weight: bold; background: #f4f6f8; }
        .pos { color: #27ae60; } .neg { color: #e74c3c; }

        .loading { text-align: center; font-size: 1.2em; color: #7f8c8d; margin-top: 50px; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .close-btn { float: right; cursor: pointer; font-size: 1.8em; font-weight: bold; color: #aaa; line-height: 1; margin-top: -10px; }
        .close-btn:hover { color: #e74c3c; }
        .modal h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .modal-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f2f6; font-size: 1.1em; }
        .modal-row:last-child { border-bottom: none; }
        .section-title { margin-top: 15px; color: #7f8c8d; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>English Land ERP Financials</h1>
        <p>Real-time data. Pick a month, then click any card to view detailed breakdowns.</p>
    </div>

    <div id="loading" class="loading">Fetching financial data...</div>

    <div id="dashboard" style="display: none;">
        <div class="toolbar">
            <button id="prevBtn" onclick="stepMonth(-1)" title="Previous month">◀</button>
            <label for="monthSelect">Period:</label>
            <select id="monthSelect" onchange="selectPeriod(this.value)"></select>
            <button id="nextBtn" onclick="stepMonth(1)" title="Next month">▶</button>
        </div>
        <div class="period-label" id="periodLabel"></div>

        <div class="dashboard-container">
            <div class="card" onclick="openModal('revenue')">
                <h3>Total Revenue</h3>
                <div class="value" id="val-revenue">0 EGP</div>
                <div class="change" id="chg-revenue"></div>
            </div>

            <div class="card expense" onclick="openModal('cogs')">
                <h3>COGS (Direct Costs)</h3>
                <div class="value" id="val-cogs">0 EGP</div>
                <div class="change" id="chg-cogs"></div>
            </div>

            <div class="card expense" onclick="openModal('opex')">
                <h3>OPEX (Operations)</h3>
                <div class="value" id="val-opex">0 EGP</div>
                <div class="change" id="chg-opex"></div>
            </div>

            <div class="card profit-net" id="card-net" onclick="openModal('net')">
                <h3>Net Profit</h3>
                <div class="value" id="val-net">0 EGP</div>
                <div class="change" id="chg-net"></div>
            </div>
        </div>

        <div class="table-wrap">
            <h2>Monthly Summary</h2>
            <table>
                <thead>
                    <tr>
                        <th>Month</th><th>Revenue</th><th>COGS</th><th>OPEX</th><th>Net Profit</th><th>Margin</th>
                    </tr>
                </thead>
                <tbody id="monthTableBody"></tbody>
                <tfoot id="monthTableFoot"></tfoot>
            </table>
        </div>
    </div>

    <!-- The Modal -->
    <div id="dataModal" class="modal" onclick="closeOutside(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">×</span>
            <h2 id="modalTitle">Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzFfp3tp64salh_hFPn1sw55y_XHSIazjzqQY7PzShvV05x8Dc_vY54KlMnUZZVCh95/exec";

        let apiData = {};          // full response data
        let currentKey = "all";    // "all" or "yyyy-MM"

        function formatCurrency(num) {
            return new Intl.NumberFormat('en-EG', { style: 'currency', currency: 'EGP' }).format(num || 0);
        }

        function monthLabel(key) {
            if (key === "all") return "All Time";
            if (key === "Undated") return "Undated entries";
            const [y, m] = key.split("-").map(Number);
            return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        function getPeriod(key) {
            return key === "all" ? apiData.allTime : apiData.months[key];
        }

        function colorFor(n) { return n >= 0 ? '#27ae60' : '#e74c3c'; }

        async function fetchFinancials() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status !== 'success') throw new Error("API returned an error");

                apiData = result.data;
                buildSelector();
                buildTable();

                // Default to the latest real month (falls back to All Time)
                const dated = apiData.monthKeys.filter(k => k !== "Undated");
                selectPeriod(dated.length ? dated[dated.length - 1] : "all");

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerText = "Failed to load data. Check that the Apps Script is redeployed and the URL is correct.";
            }
        }

        function buildSelector() {
            const sel = document.getElementById('monthSelect');
            let html = `<option value="all">All Time</option>`;
            // Newest first in the dropdown
            [...apiData.monthKeys].reverse().forEach(k => {
                html += `<option value="${k}">${monthLabel(k)}</option>`;
            });
            sel.innerHTML = html;
        }

        function buildTable() {
            const body = document.getElementById('monthTableBody');
            let html = "";
            [...apiData.monthKeys].reverse().forEach(k => {
                const p = apiData.months[k];
                const margin = p.revenue.total ? (p.net.total / p.revenue.total * 100).toFixed(1) + '%' : '—';
                html += `
                    <tr data-key="${k}" onclick="selectPeriod('${k}')">
                        <td>${monthLabel(k)}</td>
                        <td>${formatCurrency(p.revenue.total)}</td>
                        <td>${formatCurrency(p.expense.cogs)}</td>
                        <td>${formatCurrency(p.expense.opex)}</td>
                        <td class="${p.net.total >= 0 ? 'pos' : 'neg'}">${formatCurrency(p.net.total)}</td>
                        <td>${margin}</td>
                    </tr>`;
            });
            body.innerHTML = html || `<tr><td colspan="6" style="text-align:center;color:#7f8c8d">No entries yet. Add rows to the Revenues or Expenses sheet.</td></tr>`;

            const a = apiData.allTime;
            const allMargin = a.revenue.total ? (a.net.total / a.revenue.total * 100).toFixed(1) + '%' : '—';
            document.getElementById('monthTableFoot').innerHTML = `
                <tr onclick="selectPeriod('all')" style="cursor:pointer">
                    <td>All Time</td>
                    <td>${formatCurrency(a.revenue.total)}</td>
                    <td>${formatCurrency(a.expense.cogs)}</td>
                    <td>${formatCurrency(a.expense.opex)}</td>
                    <td class="${a.net.total >= 0 ? 'pos' : 'neg'}">${formatCurrency(a.net.total)}</td>
                    <td>${allMargin}</td>
                </tr>`;
        }

        function selectPeriod(key) {
            currentKey = key;
            const p = getPeriod(key);
            if (!p) return;

            document.getElementById('monthSelect').value = key;
            document.getElementById('periodLabel').innerText = "Showing: " + monthLabel(key);

            document.getElementById('val-revenue').innerText = formatCurrency(p.revenue.total);
            document.getElementById('val-cogs').innerText = formatCurrency(p.expense.cogs);
            document.getElementById('val-opex').innerText = formatCurrency(p.expense.opex);
            document.getElementById('val-net').innerText = formatCurrency(p.net.total);
            document.getElementById('card-net').classList.toggle('negative', p.net.total < 0);

            // Change vs previous month (only for real months)
            const prev = previousMonth(key);
            setChange('chg-revenue', p.revenue.total, prev && prev.revenue.total, false);
            setChange('chg-cogs', p.expense.cogs, prev && prev.expense.cogs, true);
            setChange('chg-opex', p.expense.opex, prev && prev.expense.opex, true);
            setChange('chg-net', p.net.total, prev && prev.net.total, false);

            // Highlight table row
            document.querySelectorAll('#monthTableBody tr').forEach(tr => {
                tr.classList.toggle('active', tr.dataset.key === key);
            });

            updateNavButtons();
        }

        function datedKeys() {
            return apiData.monthKeys.filter(k => k !== "Undated"); // oldest → newest
        }

        function previousMonth(key) {
            const keys = datedKeys();
            const idx = keys.indexOf(key);
            return idx > 0 ? apiData.months[keys[idx - 1]] : null;
        }

        function setChange(id, now, before, isCost) {
            const el = document.getElementById(id);
            if (before === null || before === undefined || before === false) { el.innerHTML = ""; return; }
            const diff = now - before;
            if (diff === 0) { el.innerHTML = `<span class="flat">No change vs last month</span>`; return; }
            const pct = before !== 0 ? ` (${(Math.abs(diff) / Math.abs(before) * 100).toFixed(1)}%)` : "";
            const good = isCost ? diff < 0 : diff > 0;
            el.innerHTML = `<span class="${good ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${formatCurrency(Math.abs(diff))}${pct} vs last month</span>`;
        }

        function stepMonth(dir) {
            const keys = datedKeys();
            if (!keys.length) return;
            let idx = keys.indexOf(currentKey);
            if (idx === -1) idx = dir < 0 ? keys.length : -1; // from All Time/Undated
            const next = idx + dir;
            if (next >= 0 && next < keys.length) selectPeriod(keys[next]);
        }

        function updateNavButtons() {
            const keys = datedKeys();
            const idx = keys.indexOf(currentKey);
            document.getElementById('prevBtn').disabled = !keys.length || idx === 0;
            document.getElementById('nextBtn').disabled = !keys.length || idx === keys.length - 1;
        }

        // Modal Logic (uses the currently selected period)
        function openModal(type) {
            const p = getPeriod(currentKey);
            const period = monthLabel(currentKey);
            const modal = document.getElementById('dataModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            let html = "";

            if (type === 'revenue') {
                title.innerText = `Revenue Breakdown · ${period}`;
                html = `
                    <div class="section-title">By Modality & Type</div>
                    <div class="modal-row"><span>Online:</span> <strong>${formatCurrency(p.revenue.online)}</strong></div>
                    <div class="modal-row"><span>On-site:</span> <strong>${formatCurrency(p.revenue.onsite)}</strong></div>
                    <div class="modal-row"><span>Group Classes:</span> <strong>${formatCurrency(p.revenue.group)}</strong></div>
                    <div class="modal-row"><span>Private Classes:</span> <strong>${formatCurrency(p.revenue.private)}</strong></div>

                    <div class="section-title">By Payment Method</div>
                    <div class="modal-row"><span>Vodafone Cash:</span> <strong>${formatCurrency(p.revenue.vfcash)}</strong></div>
                    <div class="modal-row"><span>Instapay:</span> <strong>${formatCurrency(p.revenue.instapay)}</strong></div>
                    <div class="modal-row"><span>Cash in Branch:</span> <strong>${formatCurrency(p.revenue.cash)}</strong></div>
                `;
            } else if (type === 'net') {
                title.innerText = `Net Profit (Cash Flow) · ${period}`;
                html = `
                    <p style="color: #7f8c8d; font-size: 0.9em; margin-top: 0;">
                        ${currentKey === 'all'
                            ? 'Current available balance in each wallet/drawer after deducting expenses paid from that specific method.'
                            : 'Money in minus money out for each wallet/drawer during this month only.'}
                    </p>
                    <div class="modal-row"><span>Vodafone Cash Wallet:</span> <strong style="color: ${colorFor(p.net.vfcash)}">${formatCurrency(p.net.vfcash)}</strong></div>
                    <div class="modal-row"><span>Instapay / Bank:</span> <strong style="color: ${colorFor(p.net.instapay)}">${formatCurrency(p.net.instapay)}</strong></div>
                    <div class="modal-row"><span>Physical Cash Drawer:</span> <strong style="color: ${colorFor(p.net.cash)}">${formatCurrency(p.net.cash)}</strong></div>
                    <div class="modal-row"><span><strong>Total:</strong></span> <strong style="color: ${colorFor(p.net.total)}">${formatCurrency(p.net.total)}</strong></div>
                `;
            } else if (type === 'cogs' || type === 'opex') {
                title.innerText = `${type.toUpperCase()} Breakdown · ${period}`;
                const amount = type === 'cogs' ? p.expense.cogs : p.expense.opex;
                const share = p.expense.total ? (amount / p.expense.total * 100).toFixed(1) + '%' : '—';
                html = `
                    <div class="modal-row"><span>Total ${type.toUpperCase()}:</span> <strong>${formatCurrency(amount)}</strong></div>
                    <div class="modal-row"><span>Share of all expenses:</span> <strong>${share}</strong></div>
                    <div class="section-title">All expenses by payment method</div>
                    <div class="modal-row"><span>Vodafone Cash:</span> <strong>${formatCurrency(p.expense.vfcash)}</strong></div>
                    <div class="modal-row"><span>Instapay:</span> <strong>${formatCurrency(p.expense.instapay)}</strong></div>
                    <div class="modal-row"><span>Cash in Branch:</span> <strong>${formatCurrency(p.expense.cash)}</strong></div>
                    <p style="color: #7f8c8d; font-size: 0.9em; text-align: center;">(Check Google Sheets for line-by-line item details)</p>
                `;
            }

            body.innerHTML = html;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('dataModal').style.display = 'none';
        }

        function closeOutside(event) {
            if (event.target.id === 'dataModal') closeModal();
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        window.onload = fetchFinancials;
    </script>
</body>
</html>
